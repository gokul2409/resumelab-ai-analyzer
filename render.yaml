services:
  - type: web
    name: resumelab-ai-analyzer
    runtime: node
    rootDir: server.mjs
    buildCommand: node --version
    startCommand: node server.mjs
    healthCheckPath: /healthz
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-astra
